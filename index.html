<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫头鹰教 - The Owl Cult</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="title" data-zh="猫头鹰教" data-en="The Owl Cult">猫头鹰教</h1>
            <p class="slogan" data-zh="咕咪" data-en="Gu Mi">咕咪</p>
            <p class="tagline" data-zh="在黑暗中，我们看得更清楚" data-en="In the darkness, we see clearly">在黑暗中，我们看得更清楚</p>
            <button class="lang-switch" onclick="toggleLanguage()">EN / 中文</button>
        </div>
    </header>

    <nav class="navbar">
        <a class="nav-brand" href="index.html">🦉 <span data-zh="猫头鹰教" data-en="The Owl Cult">猫头鹰教</span></a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="gallery.html" data-zh="画廊" data-en="Gallery">画廊</a></li>
                <li><a href="about.html" data-zh="关于" data-en="About">关于</a></li>
                <li><a href="join.html" data-zh="加入方式" data-en="Join Us">加入方式</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-main">
        <section class="gallery-section featured-section">
            <h2 class="section-title" data-zh="本月猫头鹰" data-en="Owl of the Month">本月猫头鹰</h2>
            <p class="section-desc" data-zh="雪猫头鹰 —— 我们黑暗中的守护者" data-en="Snowy Owl — our guardian in the dark">雪猫头鹰 —— 我们黑暗中的守护者</p>
            <div class="gallery-featured">
                <div class="gallery-item">
                    <img src="images/owl1.jpg" alt="Featured Owl">
                    <div class="gallery-caption" data-zh="雪猫头鹰" data-en="Snowy Owl">雪猫头鹰</div>
                </div>
            </div>
            <div class="featured-actions">
                <a class="btn-outline" href="gallery.html" data-zh="查看完整画廊" data-en="View Full Gallery">查看完整画廊</a>
            </div>
        </section>

        <section class="explore-section">
            <h2 class="section-title" data-zh="探索" data-en="Explore">探索</h2>
            <p class="section-desc" data-zh="走进猫头鹰教的世界" data-en="Step into the world of the Owl Cult">走进猫头鹰教的世界</p>
            <div class="explore-grid">
                <a class="explore-card" href="gallery.html">
                    <h3 data-zh="画廊" data-en="Gallery">画廊</h3>
                    <p data-zh="欣赏来自世界各地的猫头鹰照片" data-en="Admire owl photos from around the world">欣赏来自世界各地的猫头鹰照片</p>
                </a>
                <a class="explore-card" href="about.html">
                    <h3 data-zh="关于" data-en="About">关于</h3>
                    <p data-zh="了解我们的故事与信念" data-en="Learn our story and beliefs">了解我们的故事与信念</p>
                </a>
                <a class="explore-card" href="join.html">
                    <h3 data-zh="加入方式" data-en="Join Us">加入方式</h3>
                    <p data-zh="通过微信或邮箱与我们联系" data-en="Reach us via WeChat or email">通过微信或邮箱与我们联系</p>
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>🦉 <span data-zh="猫头鹰教" data-en="The Owl Cult">猫头鹰教</span></h3>
                <p class="footer-slogan" data-zh="咕咪" data-en="Gu Mi">咕咪</p>
            </div>
            <div class="footer-proverb">
                <div class="proverb-head">
                    <span class="proverb-label" data-zh="夜之箴言" data-en="Proverb of the Night">夜之箴言</span>
                    <button class="proverb-btn" onclick="nextProverb()" data-zh="换一句" data-en="Another">换一句</button>
                </div>
                <p class="proverb-text" id="proverbText">在黑暗中，我们看得更清楚。</p>
            </div>
            <div class="footer-info">
                <p>&copy; 2026 猫头鹰教 The Owl Cult. All rights reserved.</p>
                <p data-zh="作者：Harmony_Bry" data-en="Author: Harmony_Bry">作者：Harmony_Bry</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
